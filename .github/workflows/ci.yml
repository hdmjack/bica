name: CI

# Everything here runs without a remote machine. That is most of bica's logic: the shell scripts it
# sends, the parsers that read what comes back, the lock and claim mechanics. What needs a real host
# is covered by scripts/verify-remote.sh, which is run by hand.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
